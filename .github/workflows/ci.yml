name: Verify Metricairn
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            packages/tracker/package-lock.json
      - run: make setup
      - run: make check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metricairn
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: metricairn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metricairn"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --locked
      - run: uv run pytest -q apps/api/tests/test_postgres.py
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://metricairn:ci-only@localhost:5432/metricairn
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t metricairn:test .
      - run: |
          docker run -d --name metricairn-test -p 8000:8000 -e SCHEDULER_ENABLED=false metricairn:test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/ready; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8000/ready
          curl --fail http://localhost:8000/static/metricairn.js
          curl --fail http://localhost:8000/ | grep "Metricairn"
