name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include steps to reproduce. Never include credentials or real customer data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit, installation method, and OS
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or synthetic example
