[project]
name = "agentlens-mcp"
version = "0.1.0"
description = "AgentLens MCP server — let your AI agent query your product analytics"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
agentlens-mcp = "agentlens_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
