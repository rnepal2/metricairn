[project]
name = "metricairn-mcp"
version = "0.2.0"
license = "MIT"
description = "Metricairn MCP server — let your AI agent query your product analytics"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
metricairn-mcp = "metricairn_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metricairn_mcp*"]
exclude = ["tests*"]
