[project]
name = "metricairn-api"
version = "0.1.0"
license = "MIT"
description = "Metricairn API — privacy-friendly product analytics your AI agent can query"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.136",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "openai>=3.24,<4",
    "anthropic>=1.11,<2",
    "google-genai>=2.28,<3",
    "apscheduler>=3.10,<4",
    "sqlglot>=30,<31",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.14,<0.17"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*"]
