# Dashboard, API and tracker at http://localhost:8000. No external services required.
services:
  metricairn:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PROVISIONING_TOKEN: ${PROVISIONING_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      SCHEDULER_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/srv/data
volumes:
  data:
